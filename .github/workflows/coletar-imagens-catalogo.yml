name: Coletar candidatos de imagens oficiais

on:
  push:
    branches: [codex/vitrine-fotos-reais-2026-10-19]
    paths:
      - .github/workflows/coletar-imagens-catalogo.yml
      - scripts/collect-catalog-images.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletar-catalogo-testes
  cancel-in-progress: false

jobs:
  coletar:
    if: github.ref == 'refs/heads/codex/vitrine-fotos-reais-2026-10-19'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vitrine-fotos-reais-2026-10-19
      - name: Instalar decodificador de imagens
        run: python -m pip install --disable-pip-version-check pillow
      - name: Testar rejeicao de logos e variantes antes da coleta
        run: python -m unittest discover -s tests -p 'test_catalog_collection.py'
      - name: Coletar candidatos exatos sem alterar imagens do site
        run: python scripts/collect-catalog-images.py
      - name: Preservar candidatos temporarios para inspecao
        uses: actions/upload-artifact@v4
        with:
          name: candidatos-catalogo-revisao
          path: work/catalog-candidates/
          if-no-files-found: ignore
          retention-days: 7
      - name: Guardar somente resultado documental na branch de testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalogo-comercial-2026-10-19/candidatas/resultado.json
          if ! git diff --cached --quiet; then
            git commit -m "Registra candidatos de modelos exatos sem ativar assets"
            git push origin HEAD:codex/vitrine-fotos-reais-2026-10-19
          fi
# Não ativa imagens; não modifica public/, créditos ou aprovação comercial.
# Sem PR, merge, deploy ou tentativa de contornar HTTP 403.
