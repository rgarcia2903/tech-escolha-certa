name: Verificar links de afiliado

on:
  schedule:
    - cron: "17 11 * * 1" # segundas, 08:17 em Brasília
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [src/lib/affiliate-links.ts, scripts/affiliate-expectations.json, scripts/check-affiliate-links.mjs]

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Conferir destino de cada link
        id: check
        run: node scripts/check-affiliate-links.mjs --report relatorio-links.md
        continue-on-error: true
      - name: Publicar relatório no resumo
        if: always()
        run: cat relatorio-links.md >> "$GITHUB_STEP_SUMMARY"
      - name: Abrir ou atualizar issue quando houver link com problema
        if: steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Links de afiliado com problema"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file relatorio-links.md
          else
            gh issue create --title "$title" --body-file relatorio-links.md
          fi
      - name: Falhar quando houver link com problema
        if: steps.check.outcome == 'failure'
        run: exit 1
