name: Validar galeria e primeiro review

on:
  push:
    branches: [feat/galeria-reviews-prioridade-2026-10-19]
    paths: [.github/workflows/validar-review-galeria.yml, tests/product-media.test.tsx, src/components/site/VisualProductCard.tsx, src/routes/review.$productId.tsx, src/lib/product-catalog.ts, src/components/site/ProductGallery.tsx]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run check:links
