name: Validar galeria e primeiro review

on:
  push:
    branches: [feat/galeria-reviews-prioridade-2026-10-19]
    paths: [.github/workflows/validar-review-galeria.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run check:links
