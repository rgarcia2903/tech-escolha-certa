name: Importar imagens de catalogo para avaliacao visual

on:
  push:
    branches: [codex/vitrine-fotos-reais-2026-10-19]
    paths: [.github/workflows/importar-renders-vitrine.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vitrine-fotos-reais-2026-10-19
      - name: Baixar as imagens revisadas do artefato existente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/catalogo
          gh run download 39298422708 --name candidatos-catalogo-revisao --dir work/catalogo
          find work/catalogo -type f | head -30
      - name: Selecionar e conferir as imagens dos aparelhos
        run: |
          python - <<'PY'
          import os,hashlib,shutil,json
          base='work/catalogo'
          expected={
           'moto-g56-5g-3.webp': '15673f4f43894043266975b707c123788f3017a1b8c7d78bd9b0db74e38726e6',
           'moto-g86-5g-3.webp': '6afd8fc068b3aa00c7925b35c86ff5c32e364ec55ed240d42430b230db88deb9',
           'galaxy-s25-fe-1.webp': '0efab28b8c0e69bc8464ef30c7b5e938c07193e1a3383a9f08e0f08ca29f646c'
          }
          out='public/images/products/catalogo'
          os.makedirs(out,exist_ok=True)
          for filename,digest in expected.items():
            matches=[os.path.join(d,filename) for d,dirs,files in os.walk(base) if filename in files]
            if len(matches)!=1:raise RuntimeError(f'{filename}: esperado 1 arquivo, encontrados {len(matches)}')
            src=matches[0]
            got=hashlib.sha256(open(src,'rb').read()).hexdigest()
            if got!=digest:raise RuntimeError(f'{filename}: checksum divergente ({got})')
            destination=os.path.join(out,filename.replace('-3.webp','.webp').replace('-1.webp','.webp'))
            shutil.copyfile(src,destination)
            print(destination,os.stat(destination).st_size)
          PY
      - name: Preservar imagens na branch de desenvolvimento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/products/catalogo/
          if ! git diff --cached --quiet; then
            git commit -m "Adiciona renders selecionados para teste visual da vitrine"
            git push origin HEAD:codex/vitrine-fotos-reais-2026-10-19
          fi
# Fonte: Motorola Press Box e Samsung Brasil; confirmar direitos antes de publicar em produção.
